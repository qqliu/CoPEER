name = "proofcerts"
defaultTargets = ["ProofCerts"]

# QEDBench Stage-2 counterexample certificates.
# Each module formalizes one CERT_STRONG record's witness and proves that the
# proof's claim fails on that witness (Mathlib-faithful statements).

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "ProofCerts"

# Spoof-proofing trusted-wrapper pilot (writeup sec:correct-map):
# trusted BoundTarget + LLM witness + validator-generated wrapper.
[[lean_lib]]
name = "QEDCert"

# Part-C trusted template: one audited claim-DSL + kernel evaluator; records are
# certified by mechanical instantiation with witness data only.
[[lean_lib]]
name = "QEDTemplate"

# Lean port of the graph-bug bank: 3 references + 12 mutants + spec predicates;
# admission/bounded-correctness/bounded-equivalence theorems instantiate it.
[[lean_lib]]
name = "QEDBugBank"

# V2 template: online-cited record certification (64 ClaimV2 constructors).
[[lean_lib]]
name = "QEDTemplateV2"
